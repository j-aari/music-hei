<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>European Music Institutions with an Erasmus Charter</title>
  <meta name="description" content="Music institutions in Europe that hold an Erasmus Charter for Higher Education: where they are, what they are, and which are exchange partners.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2314181D'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/publicsans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#results">Skip to results</a>

  <header class="masthead">
    <h1><a href="./" id="home">European Music Institutions with an Erasmus Charter</a></h1>
    <p class="lede">Which music institutions in Europe hold an Erasmus Charter for Higher Education, where are they, and which are exchange partners?</p>
    <p class="scope" id="scope"></p>
  </header>

  <div class="layout" id="layout">
    <form class="filters" id="filters" role="search" aria-label="Search and filters" autocomplete="off">
      <div class="filters__head">
        <h2 class="filters__title">Filters</h2>
        <button type="button" class="btn" id="reset" hidden>Clear all filters</button>
      </div>
      <div class="search">
        <label for="q">Search name or city</label>
        <input id="q" name="q" type="search" spellcheck="false" placeholder="e.g. Hochschule, Oslo">
      </div>
      <div id="filter-groups"></div>
      <p class="missing" id="missing" hidden></p>
    </form>

    <main class="main" id="main">
      <div class="toolbar" id="toolbar">
        <p class="count" id="count" role="status" aria-live="polite"></p>
        <div class="view-toggle" role="group" aria-label="View">
          <button type="button" class="btn" data-view="list" aria-pressed="true">List</button>
          <button type="button" class="btn" data-view="map" aria-pressed="false">Map</button>
        </div>
        <button type="button" class="btn" id="csv"></button>
      </div>
      <p class="legend" id="legend" aria-hidden="true"></p>

      <div class="empty" id="empty" hidden></div>

      <section id="results" aria-label="Results" tabindex="-1">
        <div id="list-view"></div>
        <div id="map-view" hidden>
          <div id="map" role="region" aria-label="Map of the institutions in the results. The list view offers the same information in keyboard-friendly form."></div>
        </div>
      </section>
      <noscript><p class="error">This page needs JavaScript to show the list of institutions.</p></noscript>
    </main>

    <aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
      <div class="panel__bar">
        <button type="button" class="btn btn--quiet" id="panel-close">Close</button>
      </div>
      <div class="panel__body" id="panel-body"></div>
    </aside>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
